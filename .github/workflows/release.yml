name: Build static release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Build, ad-hoc sign and audit universal package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WaifuX-Wallhaven-local-build
          path: build/static-wallhaven/**
          if-no-files-found: error
# This workflow does not publish a release or update feed. Developer ID signing,
# notarization and fork-owned Sparkle keys must precede public distribution.
