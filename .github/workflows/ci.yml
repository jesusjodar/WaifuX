name: Static Wallhaven CI
on:
  push:
    branches: [main, feat/wallhaven-static-only]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Generate project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          python3 scripts/verify-project-configuration.py
          python3 scripts/generate-homebrew-cask.py --check
      - name: Static policies, production queue, cloud files and localization
        run: |
          bash scripts/test-wallhaven-static-core.sh
          bash scripts/test-wallhaven-download-queue.sh
          bash scripts/test-wallhaven-cloud-files.sh
          python3 scripts/verify-spanish-localization.py
      - name: Clean universal Debug build
        run: xcodebuild -project WaifuX.xcodeproj -scheme WaifuX -configuration Debug -derivedDataPath build/validation 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Isolated production helper integration
        run: python3 scripts/test-wallhaven-helper-integration.py build/validation/Build/Products/Debug/WaifuXHelper.app/Contents/MacOS/WaifuXHelper
      - name: Universal Release build and bundle audit
        run: |
          xcodebuild -project WaifuX.xcodeproj -scheme WaifuX -configuration Release -derivedDataPath build/validation 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          python3 scripts/verify-project-configuration.py --app build/validation/Build/Products/Release/WaifuX.app --architectures arm64 x86_64
