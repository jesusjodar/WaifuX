---
name: WaifuX
options:
  bundleIdPrefix: com.waifux
  deploymentTarget:
    macOS: '14.4'
  xcodeVersion: '26.4'
schemes:
  WaifuX:
    build:
      targets:
        WaifuX: all
        WaifuXHelper: all
    run:
      config: Debug
    archive:
      config: Release
packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.8.0
  Cache:
    url: https://github.com/hyperoslo/Cache.git
    from: 7.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.6.0
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SRHKTRJ83W
    REGISTER_APP_GROUPS: true
    ENABLE_HARDENED_RUNTIME: true
    COMBINE_HIDPI_IMAGES: true
targets:
  WaifuX:
    type: application
    platform: macOS
    sources:
    - path: App
    - path: Views
    - path: ViewModels
    - path: Models
    - path: Services
    - path: Utilities
    - path: Components
    - path: DesignSystem
    - path: Assets.xcassets
    - path: BackgroundAgent/BackgroundAgentWire.swift
    - path: BackgroundAgent/WaifuXHostBundle.swift
    - path: BackgroundAgent/BackgroundRuntimeRole.swift
    - path: BackgroundAgent/BackgroundRuntimeBridge.swift
    - path: BackgroundAgent/BackgroundAgentClient.swift
    - path: BackgroundAgent/BackgroundAgentRegistration.swift
    - path: BackgroundAgent/BackgroundChildProcessCleanup.swift
    - path: BackgroundAgent/WaifuXPreferences.swift
    - path: BackgroundAgent/com.waifux.app.helper.plist
      buildPhase:
        copyFiles:
          destination: wrapper
          subpath: Contents/Library/LaunchAgents
    - path: BackgroundAgent/com.waifux.app.helper.relinked.plist
      buildPhase:
        copyFiles:
          destination: wrapper
          subpath: Contents/Library/LaunchAgents
    settings:
      base:
        PRODUCT_NAME: WaifuX
        PRODUCT_BUNDLE_IDENTIFIER: com.waifux.app
        MARKETING_VERSION: 38.0.157
        CURRENT_PROJECT_VERSION: 38.0.157
        SWIFT_VERSION: '6.0'
        MACOSX_DEPLOYMENT_TARGET: '14.4'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SRHKTRJ83W
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        OTHER_LDFLAGS: "$(inherited)"
    dependencies:
    - package: Kingfisher
    - package: Cache
    - package: Sparkle
    - target: WaifuXHelper
      embed: true
      codeSign: true
      copy:
        destination: wrapper
        subpath: Contents/Helpers
    entitlements:
      path: WaifuX.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.application-groups:
        - group.com.waifux.app
  WaifuXHelper:
    type: application
    platform: macOS
    sources:
    - path: App
      excludes:
      - Info.plist
      - WaifuXApp.swift
    - path: Assets.xcassets
    - path: BackgroundAgent
      excludes:
      - Info.plist
      - BackgroundAgent.entitlements
      - com.waifux.app.helper.plist
      - com.waifux.app.helper.relinked.plist
    - path: Components/DisplaySelectorSheet.swift
    - path: Components/ExploreChips.swift
    - path: Components/PerformanceModifiers.swift
    - path: Models/ContentModels.swift
    - path: Models/DisplayCropSettings.swift
    - path: Models/DownloadError.swift
    - path: Models/DownloadTask.swift
    - path: Models/FavoriteSource.swift
    - path: Models/HeroPalette.swift
    - path: Models/LibraryFolder.swift
    - path: Models/LibraryFolderMembershipPolicy.swift
    - path: Models/MainTab.swift
    - path: Models/MenuBarQuickWallpaperItem.swift
    - path: Models/NetworkError.swift
    - path: Models/NetworkState.swift
    - path: Models/SchedulerConfig.swift
    - path: Models/WallhavenAPI.swift
    - path: Models/WallhavenContentPolicy.swift
    - path: Models/Wallpaper.swift
    - path: Models/WallpaperOption.swift
    - path: Services/Sync
    - path: Services/CachePersistenceService.swift
    - path: Services/CacheService.swift
    - path: Services/CropAdjustOverlayController.swift
    - path: Services/CropLayoutEngine.swift
    - path: Services/CurrentWallpaperService.swift
    - path: Services/UserLibrary.swift
    - path: Services/DesktopIconManager.swift
    - path: Services/DirectoryMigrationService.swift
    - path: Services/DesktopWallpaperSyncManager.swift
    - path: Services/DisplayCropSettingsStore.swift
    - path: Services/DownloadPathManager.swift
    - path: Services/DownloadTaskService.swift
    - path: Services/ExternalDisplayConnectionCoordinator.swift
    - path: Services/FolderLockService.swift
    - path: Services/GlobalWallpaperSyncCoordinator.swift
    - path: Services/LibraryFolderStore.swift
    - path: Services/LocalImageThumbnailCache.swift
    - path: Services/LocalWallpaperApplyService.swift
    - path: Services/LocalWallpaperScanner.swift
    - path: Services/LocalizationService.swift
    - path: Services/WallpaperLibraryService.swift
    - path: Services/MenuBarQuickSwitcherController.swift
    - path: Services/NetworkMonitor.swift
    - path: Services/NetworkService.swift
    - path: Services/NotchOverlayManager.swift
    - path: Services/PowerSourceMonitor.swift
    - path: Services/SleepPreventer.swift
    - path: Services/PortraitBlurFillWallpaperService.swift
    - path: Services/StaticWallpaperApplyService.swift
    - path: Services/StaticWallpaperGrainManager.swift
    - path: Services/StatusBarController.swift
    - path: Services/SystemMemoryPressure.swift
    - path: Services/TaskQueueStatusService.swift
    - path: Services/WallpaperApplySupport.swift
    - path: Services/WallpaperSchedulerService.swift
    - path: Services/WallpaperSystemCacheJanitor.swift
    - path: Utilities/AppFluidMotion.swift
    - path: Utilities/OwnedProcessIdentity.swift
    - path: Utilities/AppLogger.swift
    - path: Utilities/ArcBackgroundSettings.swift
    - path: Utilities/ArcFrostedGlass.swift
    - path: Utilities/Debouncer.swift
    - path: Utilities/DeferredResourceCleanup.swift
    - path: Utilities/ExploreAtmosphere.swift
    - path: Utilities/FileIO.swift
    - path: Utilities/LegacyRecordReader.swift
    - path: Utilities/GitHubHosts.swift
    - path: Utilities/NSScreen+Wallpaper.swift
    - path: Utilities/NSWorkspace+StaticWallpaper.swift
    - path: Utilities/ProcessLiveness.swift
    - path: Utilities/WallpaperBoundedImageDecoder.swift
    - path: Utilities/WallpaperSnapshotPixelBudget.swift
    - path: Utilities/WaifuXUIActions.swift
    - path: ViewModels/WallpaperViewModel.swift
    - path: Views/MenuBarQuickSwitcherView.swift
    - path: DesignSystem/LiquidGlassDesignSystem.swift
    - path: DesignSystem/ThemeManager.swift
    - path: Services/StaticWallpaperRequestCoordinator.swift
    dependencies:
    - package: Kingfisher
    - package: Cache
    settings:
      base:
        PRODUCT_NAME: WaifuXHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.waifux.app.helper
        MARKETING_VERSION: 38.0.157
        CURRENT_PROJECT_VERSION: 38.0.157
        SWIFT_VERSION: '6.0'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WAIFUX_HELPER"
        OTHER_LDFLAGS: "$(inherited)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../../Frameworks"
        MACOSX_DEPLOYMENT_TARGET: '14.4'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SRHKTRJ83W
        ENABLE_HARDENED_RUNTIME: true
        INFOPLIST_FILE: BackgroundAgent/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: BackgroundAgent/BackgroundAgent.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.application-groups:
        - group.com.waifux.app
